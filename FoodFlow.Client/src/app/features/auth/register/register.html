<div class="auth-container">

  <div class="auth-card">

    <h2>Create Account 🚀</h2>
    <p class="subtitle">Join FoodFlow today</p>

    <form (ngSubmit)="register()">

      <input
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Name"
        required>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        required>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required>

      <button type="submit">Register</button>

    </form>

  </div>

</div>
