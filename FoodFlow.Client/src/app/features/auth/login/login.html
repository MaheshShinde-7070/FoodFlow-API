<div class="auth-container">

  <div class="auth-card">

    <h2>Welcome Back 👋</h2>
    <p class="subtitle">Login to your FoodFlow account</p>

    <form (ngSubmit)="login()">

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        required>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required>

      <button type="submit">Login</button>

    </form>

  </div>

</div>
